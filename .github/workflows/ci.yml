name: CI

on:
  # main ブランチへの push でCIを実行
  push:
    branches: ["main"]
  # PR作成時・PRコミット時にCIを実行
  pull_request:
    types: [opened, synchronize]

jobs:
  test:
    # GitHubが用意する標準Linux環境で実行
    runs-on: ubuntu-latest
    # 無限ループ対策。20分で強制終了
    timeout-minutes: 20
    steps:
      # リポジトリのコードを取得
      - name: Checkout
        uses: actions/checkout@v4

      # Docker Compose 用の環境変数を設定
      - name: Setup Docker Compose environment
        run: |
          {
            echo "APP_ENV=ci"
            echo "UID=1000"
            echo "GID=1000"
            echo "MYSQL_ROOT_PASSWORD=root"
            echo "MYSQL_DATABASE=tecknical_stack_test"
            echo "MYSQL_USER=tecknical_stack"
            echo "MYSQL_PASSWORD=password"
          } > .env

      # コンテナ実行ユーザーが依存ライブラリを書き込めるようにする
      - name: Adjust workspace permissions
        run: sudo chown -R 1000:1000 frontend/react backend/laravel

      # Docker Compose のコンテナを起動
      - name: Start containers
        run: docker compose up -d --build frontend backend

      # React側の依存ライブラリをインストール
      - name: Install frontend dependencies
        run: docker compose exec -T frontend npm ci

      # Laravel側の依存ライブラリをインストール
      - name: Install backend dependencies
        run: docker compose exec -T backend composer install --no-interaction --prefer-dist

      # React側の静的解析を実行
      - name: Run frontend lint
        run: docker compose exec -T frontend npm run lint

      # React側のビルドを実行
      - name: Run frontend build
        run: docker compose exec -T frontend npm run build

      # Laravel側の静的解析を実行
      - name: Run backend static analysis
        run: docker compose exec -T backend ./vendor/bin/phpstan analyse --memory-limit=1G

      # Unit / Feature テストを実行
      - name: Run backend tests
        run: docker compose exec -T backend php artisan test --colors=always
